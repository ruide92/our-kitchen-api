name: Backend v1 foundation
on:
  push:
    branches: [codex/kitchen-v4]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kitchen_test
          POSTGRES_USER: kitchen_test
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kitchen_test -d kitchen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kitchen_test:ci-only-test-password@localhost:5432/kitchen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: PostgreSQL and unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test | tee backend-test-results.txt
      - name: Read-only dependency audit (known risk, not auto-fixed)
        continue-on-error: true
        run: npm audit --json --registry=https://registry.npmjs.org > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-checkpoint-evidence
          path: |
            backend-test-results.txt
            npm-audit.json
